[package]
name = "audio2video-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
nalgebra = { version = "0.35.0", default-features = false, features = ["std", "serde-serialize"]}
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
toml = { version = "1.1.8+spec-1.1.0", default-features = false, features = ["std", "serde", "parse"] }
