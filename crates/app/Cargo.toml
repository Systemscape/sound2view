[package]
name = "sound2view-app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sound2view"
path = "src/main.rs"

[dependencies]
sound2view-core = { path = "../core" }
image = { version = "0.25.10", default-features = false, features = ["png"] }
eframe = "0.37.0"
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }
