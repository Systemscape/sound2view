# sound2view settings. Every entry is optional; the values below are the defaults.
# Unknown entries are an error, so typos do not go unnoticed.

[audio]
# Part of the input device id or name, see `sound2view probe`. Default per platform:
# "hw:CARD=UMA16v2" on Linux (ALSA lists the UMA-16 several times, only hw: is raw),
# "UMA16" on macOS
# device = "hw:CARD=UMA16v2"
sample_rate = 48000

[camera]
# Part of the camera name (case-insensitive), see `sound2view camprobe`
name = "icspring"
# Capture format, see `sound2view camprobe`; MJPEG if offered, else the closest format
width = 1920
height = 1080
fps = 30
# Horizontal field of view at this resolution, measured on a wall; ignored with a calibration
hfov_deg = 83.0

# Not a default (default: none, pinhole from hfov_deg). Checkerboard calibration of the icspring
# camera at 1920x1080 (OpenCV, 25 images, RMS 0.28 px), only valid at width x height above.
# Distortion coefficients in OpenCV order (k1, k2, p1, p2, k3).
[camera.calibration]
fx = 1046.19
fy = 1046.79
cx = 986.79
cy = 608.80
dist = [-0.0382, 0.0720, -0.0000794, 0.000768, -0.0516]

[pipeline]
# STFT length, hop is half of it
fft_len = 1024
# Memory of the sliding covariance in STFT frames (40: about 0.43 s at 48 kHz)
memory_frames = 40
# One map every this many STFT frames (10: about 0.11 s at 48 kHz)
map_every = 10
# Band summed in the map, in Hz (adjustable in the GUI)
f_lo_hz = 900.0
f_hi_hz = 4100.0
# Scan grid width in grid pixels; the height follows from the camera aspect ratio
grid_width = 64
# Focus distance in meters
grid_z = 2.0

[beamformer]
# "das", "functional" or "clean_sc" (selectable in the GUI)
method = "clean_sc"
# Exponent of functional beamforming: larger is sharper, more sensitive to model errors
nu = 20.0
# Functional: subtract the median eigenvalue (noise estimate) per bin (toggle in the GUI)
functional_noise_removal = true
# Functional: weight all frequency bins alike, so the broad low bins do not dominate; bins more
# than 20 dB below the strongest are left out (toggle in the GUI)
functional_equal_bins = true
# CLEAN-SC loop gain in (0, 1]
clean_gain = 0.9
# CLEAN-SC: maximum number of removed sources per frequency bin (adjustable in the GUI)
clean_max_iter = 10
# CLEAN-SC: stop when the strongest remaining source is this many dB below the strongest
# dirty-map value of all bins (bins without a source add nothing)
clean_stop_db = 20.0
# CLEAN-SC: width (standard deviation) of the Gaussian clean beam in grid cells; 0: single points
clean_beam_cells = 1.5
# CLEAN-SC: give every frequency bin with a source the same weight in the map (toggle in the
# settings menu). Otherwise the loudest bins decide, and those are the low ones, where the array
# cannot separate a source from its reflection off a wall or the ceiling
clean_equal_bins = true

[display]
# Overlay range in dB below the map maximum (adjustable in the GUI)
db_range = 3.0

[peaks]
# Local maxima of each map, followed as tracks (see [tracking])
# Show the tracks as dots (toggle "Tracks" in the GUI)
enabled = true
# Only maxima at most this many dB below the map maximum
range_db = 6.0
# Minimum distance between two peaks in grid cells; the weaker one is dropped
min_dist_cells = 4.0
# At most this many peaks, strongest first
max_count = 5
# A peak is a source only if this many dB more power arrives coherently from its direction than
# from any direction in silence (the noise floor, learned from the quietest map of the last
# minute: a pause between words is enough; a steady background source such as a fan is part of
# it). Slider next to "Tracks" in the GUI
min_above_floor_db = 8.0

[tracking]
# A peak continues a track if it is at most this far away, in grid cells
max_dist_cells = 6.0
# Maps with a matching peak (not in a row) until a track is shown (and recorded in the CLI modes)
min_hits = 3
# Maps in a row without a matching peak until a track is dropped
max_missed = 5
# Weight of the new peak in the smoothed position, in (0, 1]; 1 follows the peak exactly (less
# puts the dot between two spots when the map's maximum jumps, e.g. to a reflection)
smoothing = 1.0

[speech]
# Classify the audio of each track (voice-activity-detection model); speech tracks are green
enabled = true
# Model exported by voice-activity-detection, relative to the working directory
model = "model/speech_detector.json"
# Smoothed probability at which a track becomes speech (adjustable in the GUI)
on_threshold = 0.95
# Speech is held this long after the last frame at on_threshold or above, in ms (pauses between
# words stay speech; other sounds after the speech do not keep it)
hold_ms = 500.0
# Time constant of the probability smoothing, in ms (0: no smoothing)
smoothing_ms = 50.0
# The smoothed probability must stay at on_threshold this long before a track turns green, in ms
# (snapping and clapping are shorter than a syllable)
min_onset_ms = 80.0
# A speech track whose audio correlates at least this much (within 20 ms) with a speech track that
# has echo_margin_db more speech energy repeats its speech (reflection, ghost, leakage into another
# sound such as snapping) and stays blue ("echo of #N"); 1 turns the check off
echo_correlation = 0.2
echo_margin_db = 6.0
# Speech ends at once when the track moves farther than this (grid cells) from where it was last
# clearly speech, so another source nearby that takes over the track does not inherit it
max_shift_cells = 3.0
# Gain on the track audio before the classifier, in dB (the classifier expects microphone levels,
# speech around -25 dBFS; the UMA-16 gives about -60 dBFS)
gain_db = 36.0
# Classifier frames quieter than this (after gain_db) count as non-speech, in dBFS
min_level_db = -55.0
# A track is speech only while at least this fraction (dB) of the power received above 2 kHz
# arrives coherently from it: below 2 kHz every beam carries every talker, so a talker elsewhere
# (also outside the image) would turn other tracks green
min_source_db = -6.0
