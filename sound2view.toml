# sound2view settings. Every entry is optional; the values below are the defaults.
# Unknown entries are an error, so typos do not go unnoticed.

[audio]
# Part of the input device id or name, see `sound2view probe`. Default per platform:
# "hw:CARD=UMA16v2" on Linux (ALSA lists the UMA-16 several times, only hw: is raw),
# "UMA16" on macOS
# device = "hw:CARD=UMA16v2"
sample_rate = 48000

[camera]
# Part of the camera name (case-insensitive), see `sound2view camprobe`
name = "icspring"
# Capture format, see `sound2view camprobe`; MJPEG if offered, else the closest format
width = 1920
height = 1080
fps = 30
# Horizontal field of view at this resolution, measured on a wall; ignored with a calibration
hfov_deg = 83.0

# Not a default (default: none, pinhole from hfov_deg). Checkerboard calibration of the icspring
# camera at 1920x1080 (OpenCV, 25 images, RMS 0.28 px), only valid at width x height above.
# Distortion coefficients in OpenCV order (k1, k2, p1, p2, k3).
[camera.calibration]
fx = 1046.19
fy = 1046.79
cx = 986.79
cy = 608.80
dist = [-0.0382, 0.0720, -0.0000794, 0.000768, -0.0516]

[pipeline]
# STFT length, hop is half of it
fft_len = 1024
# Memory of the sliding covariance in STFT frames (40: about 0.43 s at 48 kHz)
memory_frames = 40
# One map every this many STFT frames (10: about 0.11 s at 48 kHz)
map_every = 10
# Band summed in the map, in Hz (adjustable in the GUI)
f_lo_hz = 900.0
f_hi_hz = 4100.0
# Scan grid width in grid pixels; the height follows from the camera aspect ratio
grid_width = 64
# Focus distance in meters
grid_z = 2.0

[beamformer]
# "das", "functional" or "clean_sc" (selectable in the GUI)
method = "functional"
# Exponent of functional beamforming: larger is sharper, more sensitive to model errors
nu = 20.0
# Functional: subtract the median eigenvalue (noise estimate) per bin (toggle in the GUI)
functional_noise_removal = true
# Functional: weight all frequency bins alike, so the broad low bins do not dominate; bins more
# than 20 dB below the strongest are left out (toggle in the GUI)
functional_equal_bins = true
# CLEAN-SC loop gain in (0, 1]
clean_gain = 0.9
# CLEAN-SC: maximum number of removed sources per frequency bin (adjustable in the GUI)
clean_max_iter = 10
# CLEAN-SC: stop when the strongest remaining source is this many dB below the strongest
# dirty-map value of all bins (bins without a source add nothing)
clean_stop_db = 20.0
# CLEAN-SC: width (standard deviation) of the Gaussian clean beam in grid cells; 0: single points
clean_beam_cells = 1.5

[display]
# Overlay range in dB below the map maximum (adjustable in the GUI)
db_range = 3.0

[peaks]
# Estimated source positions (blue dots): local maxima of the map (toggle in the GUI)
enabled = true
# Only maxima at most this many dB below the map maximum
range_db = 6.0
# Minimum distance between two peaks in grid cells; the weaker one is dropped
min_dist_cells = 4.0
# At most this many peaks, strongest first
max_count = 5
